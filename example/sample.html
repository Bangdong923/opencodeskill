<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀 주간 리포트</title>
<style>
  :root { --muted: #aaaaaa; --brand: #7c3aed; }
  body { font-family: 'Comic Sans MS', sans-serif; background: #ffffff; color: #333; line-height: 1.2; margin: 0; padding: 13px; }
  h1 { font-size: 34px; color: var(--brand); margin-bottom: 7px; }
  h2 { font-size: 22px; font-family: Georgia, serif; }
  .note { color: var(--muted); font-size: 13px; }
  .wrap { width: 960px; margin: 0 auto; }
  .card { background: #f0f0f0; padding: 18px; border-radius: 6px; margin: 10px 0; }
  .card p { font-size: 15px; font-family: Verdana; }
  .btn { background: #7c3aed; color: #ffffff; height: 30px; padding: 5px 11px; border-radius: 20px; transition: all .3s; }
  .tag { color: #ffeb3b; font-size: 12px; border-radius: 3px; }
  .footer { font-size: 11px; color: rgba(0,0,0,.3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>팀 주간 리포트</h1>
  <p class="note">2026년 9월 넷째 주</p>
  <div class="card"><h2>이번 주 성과</h2><p>배포 3건, 버그 수정 12건.</p><span class="tag">NEW</span></div>
  <img src="chart.png">
  <a class="btn" href="#">자세히 보기</a>
  <p class="footer">사내용</p>
</div>
</body>
</html>
